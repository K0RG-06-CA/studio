[package]
name = "studio-doc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Studio's shared document: LightCraft's develop settings as a live base layer under PhotoCraft's layer tree, in one file"

[lints]
workspace = true

[dependencies]
lightcraft-engine = { workspace = true }
# the point type LightCraft's frame mapping speaks (Pixel layers follow a Develop geometry change)
lightcraft-geom = { workspace = true }
photocraft-doc = { workspace = true }
photocraft-raster = { workspace = true }
photocraft-color = { workspace = true }
photocraft-geom = { workspace = true }
photocraft-format = { workspace = true }
# the pixel half's home while the document is open (its session, with its own undo)
photocraft-engine = { workspace = true }
# image files opened as documents without a photo (and the PSD fixtures of the tests)
photocraft-io = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# the reference compositor: proves the base layer composites as PhotoCraft sees it
photocraft-compose = { workspace = true }
