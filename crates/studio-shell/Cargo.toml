[package]
name = "studio-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Studio shell: Affinity-style top bar, personas, dark theme and panel docking"

[lints]
workspace = true

[dependencies]
egui = { workspace = true }
egui_dock = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
lightcraft-ui-egui = { workspace = true }
lightcraft-engine = { workspace = true }

[dev-dependencies]
# same format eframe saves the app state in
ron = { workspace = true }
# a library whose writes fail (test of quitting with unsaved changes)
lightcraft-catalog = { workspace = true }
# wgpu + snapshot: only for the opt-in `render_personas` test (PNG renders for a visual check)
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
