[package]
name = "studio-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Studio shell: Affinity-style top bar, personas, dark theme and panel docking"

[lints]
workspace = true

[dependencies]
egui = { workspace = true }
egui_dock = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
lightcraft-ui-egui = { workspace = true }
lightcraft-engine = { workspace = true }
studio-doc = { workspace = true }
photocraft-ui-egui = { workspace = true }
photocraft-engine = { workspace = true }
# PhotoCraft's editor runs only as an `eframe::App` (its `logic`/`ui` take an eframe frame)
eframe = { workspace = true }

[dev-dependencies]
# the reference compositor: checks what the document's base layer shows
photocraft-compose = { workspace = true }
# documents for PhotoCraft's editor in the milestone 4 spike
photocraft-doc = { workspace = true }
photocraft-color = { workspace = true }
photocraft-geom = { workspace = true }
# PNG and PSD files to open straight into Pixel, as PhotoCraft writes them
photocraft-io = { workspace = true }
# same format eframe saves the app state in
ron = { workspace = true }
# a library whose writes fail (test of quitting with unsaved changes)
lightcraft-catalog = { workspace = true }
# wgpu + snapshot: only for the opt-in `render_personas` test (PNG renders for a visual check)
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
