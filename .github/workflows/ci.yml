# Format, lint and test on every platform Studio must run on (PRD › Goals: ARM64 is a hard
# requirement, and milestone 7 says to check ARM64 + Linux from milestone 1 onward).
name: ci

# Docs-only changes (PRD, PROGRESS, CLAUDE.md…) don't need a 4-platform build.
on:
  push:
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

# No debug info: with PhotoCraft, target/ outgrew ubuntu-latest's disk (ld died with 30 MB left).
env:
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      # Same list as PhotoCraft's CI minus GTK (rfd's Linux dialogs use the XDG portal, pure Rust).
      - name: Install Linux system dependencies (egui/winit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # target/ and the cargo registry/git checkouts (LightCraft) per OS and Cargo.lock
      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Headless egui_kittest tests; the GPU `render_personas` test is #[ignore]d (no GPU on runners).
      - name: Test
        run: cargo test --workspace --locked
