# Format, lint and test on every platform Studio must run on (PRD › Goals: ARM64 is a hard
# requirement, and milestone 7 says to check ARM64 + Linux from milestone 1 onward).
name: ci

# Docs-only changes (PRD, PROGRESS, CLAUDE.md…) don't need a 4-platform build.
on:
  push:
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

# Read-only token: CI only builds and tests.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No debug info: with PhotoCraft, target/ outgrew ubuntu-latest's disk (ld died with 30 MB left).
env:
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Same list as PhotoCraft's CI minus GTK (rfd's Linux dialogs use the XDG portal, pure Rust).
      - name: Install Linux system dependencies (egui/winit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt

      # target/ and the cargo registry/git checkouts (LightCraft) per OS and Cargo.lock
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Headless egui_kittest tests; the GPU `render_personas` test is #[ignore]d (no GPU on runners).
      - name: Test
        run: cargo test --workspace --exclude studio-shell --locked

      # 2 threads, as locally: with the default count, its demo renders waited past their 300 s
      # limits on the x64 runners
      - name: Test studio-shell
        run: cargo test -p studio-shell --locked -- --test-threads=2
