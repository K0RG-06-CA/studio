[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"

[workspace.dependencies]
# internal
studio-shell = { path = "crates/studio-shell" }
studio-doc = { path = "crates/studio-doc" }

# storytold LightCraft, pinned (PRD: Staying in sync with storytold). Update = change both revs.
lightcraft-ui-egui = { git = "https://github.com/storytold/lightcraft", rev = "eeb136b9eec179805307c4626596f0ccc074368b" }
lightcraft-engine = { git = "https://github.com/storytold/lightcraft", rev = "eeb136b9eec179805307c4626596f0ccc074368b" }
lightcraft-catalog = { git = "https://github.com/storytold/lightcraft", rev = "eeb136b9eec179805307c4626596f0ccc074368b" }

# storytold PhotoCraft, pinned (milestone 3: its layer tree and .pcraft bundle are the pixel half
# of Studio's document). Update = change every rev.
photocraft-doc = { git = "https://github.com/storytold/photocraft", rev = "d836e3458d77c316b48604fb54525b1dc9217408" }
photocraft-raster = { git = "https://github.com/storytold/photocraft", rev = "d836e3458d77c316b48604fb54525b1dc9217408" }
photocraft-color = { git = "https://github.com/storytold/photocraft", rev = "d836e3458d77c316b48604fb54525b1dc9217408" }
photocraft-geom = { git = "https://github.com/storytold/photocraft", rev = "d836e3458d77c316b48604fb54525b1dc9217408" }
photocraft-format = { git = "https://github.com/storytold/photocraft", rev = "d836e3458d77c316b48604fb54525b1dc9217408" }
photocraft-compose = { git = "https://github.com/storytold/photocraft", rev = "d836e3458d77c316b48604fb54525b1dc9217408" }

# external — egui/eframe match storytold's LightCraft and PhotoCraft (0.36); bump in lockstep
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_dock = { version = "0.21", features = ["serde"] }
egui_kittest = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
log = "0.4"
ron = "0.12"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
